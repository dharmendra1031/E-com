name: Marketplace SQL scale benchmark
on:
  workflow_dispatch:
  push:
    branches: [development]
    paths: ['scripts/marketplace/benchmark-catalog.sql','.github/workflows/marketplace-scale.yml']
permissions:
  contents: read
jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark one million synthetic products and two million listings
        shell: bash
        run: |
          set -euo pipefail
          password='MarketplaceScaleCi_2026!Test'
          docker run -d --name scale-ci -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          trap 'docker rm -f scale-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if docker exec scale-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q "SELECT 1" >/dev/null 2>&1; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs scale-ci; exit 1; fi
          docker exec scale-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q "CREATE DATABASE MarketplaceScaleTest"
          docker cp scripts/. scale-ci:/tmp/scale/
          docker exec -w /tmp/scale scale-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceScaleTest -i marketplace/benchmark-catalog.sql | tee marketplace-scale.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: marketplace-scale-log
          path: marketplace-scale.log
          if-no-files-found: ignore
