name: Web application CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore web project
        run: dotnet restore Ecommerce/EcommerceWebApplication.csproj
      - name: Build web project
        run: dotnet build Ecommerce/EcommerceWebApplication.csproj --configuration Release --no-restore
      - name: Verify staff password behavior
        run: dotnet run --project tests/StaffPasswordChecks/StaffPasswordChecks.csproj --configuration Release
      - name: Verify admin and vendor authorization boundaries
        run: dotnet run --project tests/PortalAuthorizationChecks/PortalAuthorizationChecks.csproj --configuration Release
      - name: List vulnerable dependencies
        run: dotnet list Ecommerce/EcommerceWebApplication.csproj package --vulnerable --include-transitive

  inventory-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Rehearse additive inventory migration on disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          password='InventoryCi_2026!Test'
          docker run -d --name inventory-ci -p 127.0.0.1:1433:1433 -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" mcr.microsoft.com/mssql/server:2022-latest
          trap 'docker rm -f inventory-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for attempt in {1..60}; do
            if docker exec inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q "SELECT 1" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then docker logs inventory-ci; exit 1; fi
          docker exec inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q "CREATE DATABASE InventoryMigrationTest"
          docker cp scripts/inventory/. inventory-ci:/tmp/
          inventory_result=0
          docker exec -w /tmp inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d InventoryMigrationTest -i test-schema.sql || inventory_result=$?
          docker exec inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -Q "CREATE DATABASE MarketplaceMigrationTest"
          docker cp scripts/marketplace/. inventory-ci:/tmp/marketplace/
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-schema.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-admin-page-mapping.sql
          docker cp scripts/inventory/. inventory-ci:/tmp/marketplace/inventory/
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i inventory/test-listing-inventory.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i inventory/test-order-reservations.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-marketplace-offers.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-cart-listing.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-vendor-orders.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-marketplace-payment.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-return-receipts.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-vendor-fulfillment.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-customer-orders.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-return-workflow.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-vendor-finance.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-refund-review.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-first-party-listings.sql
          docker exec -w /tmp/marketplace inventory-ci /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$password" -C -b -I -d MarketplaceMigrationTest -i test-opening-stock.sql
          export MARKETPLACE_TEST_CONNECTION="Server=127.0.0.1,1433;Database=MarketplaceMigrationTest;User Id=sa;Password=$password;Encrypt=True;TrustServerCertificate=True"
          export MARKETPLACE_HTTP_TEST_PASSWORD="$(openssl rand -hex 24)"
          export MARKETPLACE_HTTP_TEST_IDS="$RUNNER_TEMP/vendor-http-ids.json"
          dotnet run --project tests/PortalAuthorizationChecks/PortalAuthorizationChecks.csproj --configuration Release
          export ConnectionStrings__DefaultConnection="$MARKETPLACE_TEST_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          export ASPNETCORE_URLS=https://127.0.0.1:5443
          export ASPNETCORE_Kestrel__Certificates__Default__Path="$RUNNER_TEMP/vendor-http.pfx"
          export ASPNETCORE_Kestrel__Certificates__Default__Password="$MARKETPLACE_HTTP_TEST_PASSWORD"
          dotnet dev-certs https -ep "$ASPNETCORE_Kestrel__Certificates__Default__Path" -p "$ASPNETCORE_Kestrel__Certificates__Default__Password"
          for flag in VendorMasterEnabled VendorPortalEnabled VendorInventoryEnabled VendorOrdersEnabled VendorFulfillmentEnabled ReturnWorkflowEnabled FinancePreviewEnabled; do
            export "Marketplace__${flag}=true"
          done
          export Marketplace__SellerCheckoutTestEnabled=false Marketplace__ReservationExpiryWorkerEnabled=false Marketplace__PaymentReconciliationWorkerEnabled=false
          (cd Ecommerce && exec dotnet run --configuration Release --no-build --no-launch-profile) > "$RUNNER_TEMP/vendor-http.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; docker rm -f inventory-ci >/dev/null 2>&1 || true' EXIT
          if ! python3 tests/PortalAuthorizationChecks/vendor_http_smoke.py; then
            tail -100 "$RUNNER_TEMP/vendor-http.log"
            exit 1
          fi
          exit "$inventory_result"
